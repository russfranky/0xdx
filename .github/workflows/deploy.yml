name: Build & Deploy

# Build runs on every push to main as CI.
# Deploy is gated: it only runs when invoked manually OR when the repo
# variable GH_PAGES_AUTODEPLOY is set to "true". This lets the workflow
# sit dormant if the project is hosted via Cloudflare Pages instead.
#
# To enable GitHub Pages auto-deploy:
#   1. Repo settings -> Pages -> Source = "GitHub Actions"
#   2. Repo settings -> Secrets and variables -> Actions -> Variables tab
#      -> add GH_PAGES_AUTODEPLOY with value "true"

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GH_PAGES_AUTODEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
