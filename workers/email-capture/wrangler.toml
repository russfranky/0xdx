name = "0xdx-email-capture"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Allowed origins for CORS. Edit these to match your real domains.
# Add http://localhost:5173 etc. for local dev.
[vars]
ALLOWED_ORIGINS = "https://0xdx.com,https://www.0xdx.com,https://russfranky.github.io"

# Secrets set via `wrangler secret put`:
#   RESEND_API_KEY       — your new Resend API key (NOT the leaked one)
#   RESEND_AUDIENCE_ID   — UUID of the audience to add subscribers to
#   RESEND_FROM_ADDRESS  — e.g. "0xdx <hello@0xdx.com>" (verified domain)
#
# Rate-limit storage (optional but recommended). Create with:
#   wrangler kv namespace create EMAIL_RL
# then paste the id below and re-deploy.
# [[kv_namespaces]]
# binding = "EMAIL_RL"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
