name = "0xdx-email-capture"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Allowed origins for CORS. Edit these to match your real domains.
# Add http://localhost:5173 etc. for local dev.
[vars]
ALLOWED_ORIGINS = "https://0xdx.com,https://www.0xdx.com,https://russfranky.github.io"

# Secrets set via `wrangler secret put`:
#   RESEND_API_KEY       — Resend send-only key (v0) or full-access key (later)
#   RESEND_FROM_ADDRESS  — e.g. "0xdx signups <onboarding@resend.dev>"
#                          (resend.dev sender is restricted to mailing the
#                          Resend account owner; verify a real domain to send
#                          confirmations to subscribers)
#   NOTIFY_TO            — operator address; receives one email per signup
#
# Subscriber list + rate-limit storage live in the same KV namespace,
# distinguished by key prefix:
#   sub:<email>  → JSON metadata (the recoverable list)
#   rl:<ip>      → request counter, TTL 10m
# Create the namespace with:
#   npx wrangler kv namespace create EMAIL_RL
# then paste the returned id into the binding below.
[[kv_namespaces]]
binding = "EMAIL_RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
